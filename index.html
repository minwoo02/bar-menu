<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Menu Board</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --primary: #e67e22;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --tag-bg: #333333;
        }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0; padding: 20px;
        }
        .header {
            text-align: center; margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5rem; color: var(--primary); margin: 0 0 10px 0;
            letter-spacing: 2px;
        }
        .header p { color: var(--text-sub); font-size: 1.1rem; margin-bottom: 5px; }
        .disclaimer { color: #e74c3c; font-size: 0.9rem; font-weight: bold; }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(230, 126, 34, 0.2);
            border-color: var(--primary);
        }
        
        .card-img {
            width: 100%; height: 200px; object-fit: cover;
            border-bottom: 2px solid #2a2a2a;
            background-color: #000;
        }
        
        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .drink-title { font-size: 1.4rem; font-weight: bold; margin: 0 0 10px 0; }
        .drink-desc { font-size: 0.95rem; color: var(--text-sub); line-height: 1.5; margin-bottom: 15px; flex-grow: 1; }
        
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag {
            background-color: var(--tag-bg); color: #ddd;
            padding: 4px 10px; border-radius: 12px; font-size: 0.8rem;
        }
        .tag.base { background-color: var(--primary); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍸 M.W. 2002 Bar Menu</h1>
        <p>원하는 스타일을 골라주시면 민우가 맛있게 말아드립니다.</p>
        <p class="disclaimer">※ 메뉴판의 사진은 연출된 이미지로 실제와 다를 수 있습니다.</p>
    </div>

    <div class="menu-grid" id="menuGrid">
    </div>

            },

            {

                tags: ["커피향", "묵직함", "도수매우높음"]
            }
        ];

        const grid = document.getElementById('menuGrid');

        menuItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let tagsHtml = `<span class="tag base">${item.base} 베이스</span>`;
            item.tags.forEach(t => {
                tagsHtml += `<span class="tag">${t}</span>`;
            });

            card.innerHTML = `
                <img src="${item.img}" alt="${item.name}" class="card-img" onerror="this.src='https://placehold.co/600x400/252525/e67e22?font=montserrat&text=Image+Not+Found'">
                <div class="card-content">
                    <h2 class="drink-title">${item.name}</h2>
                    <p class="drink-desc">${item.desc}</p>
                    <div class="tags">
                        ${tagsHtml}
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
